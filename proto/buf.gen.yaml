version: v2
plugins:
  - remote: buf.build/protocolbuffers/go:v1.36.11
    out: .
    opt: paths=source_relative
  - local:
      - go
      - run
      - ../errors/protoc-gen-kit-errors/main.go
    out: .
    exclude_types:
      - kit.errors.v1
  - local:
      - go
      - run
      - ../logging/protoc-gen-go-redact/main.go
    out: .
    opt: paths=source_relative
    exclude_types:
      - kit.sse.v1
